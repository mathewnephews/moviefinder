<!DOCTYPE html>
<html lang="nl">
<head>
<link rel="icon" href="/favicon.png" type="image/png"">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Streaming Finder (België)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #141414;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background-color: #1f1f1f;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      text-align: center;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #2b2b2b;
      color: #fff;
    }
    button {
      padding: 10px 15px;
      border: none;
      background-color: #e50914;
      color: white;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #b80710;
    }
    .results {
      margin-top: 20px;
    }
    .provider-list {
      list-style: none;
      padding: 0;
    }
    .provider-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #2b2b2b;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
    }
    .provider-item img {
      width: 32px;
      height: 32px;
      border-radius: 4px;
    }
    .error {
      color: #ff6b6b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Zoek Film Streaming (België)</h1>
    <form id="searchForm" class="search-box">
      <input type="text" id="movieInput" placeholder="Vul een filmtitel in (bijv. Dune)..." required>
      <button type="submit">Zoeken</button>
    </form>

    <div id="results" class="results"></div>
  </div>

  <script>
    // Vul hier je eigen TMDB API Key in:
    const API_KEY = 'f7d76ef717879269890c75b78b7c71d9'; 
    const REGION = 'BE';

    // Uitgebreide lijst met streamingdiensten
    const ALLOWED_PROVIDERS = [
      'Netflix', 
      'Disney Plus', 
      'Streamz', 
      'Hulu', 
      'Amazon Prime Video', 
      'Max',          // HBO Max
      'HBO', 
      'Apple TV', 
      'YouTube', 
      'Google Play Movies' // TMDB gebruikt 'Google Play Movies' voor Google TV
    ];

    document.getElementById('searchForm').addEventListener('submit', function(e) {
      e.preventDefault();
      searchMovie();
    });

    async function searchMovie() {
      const query = document.getElementById('movieInput').value.trim();
      const resultsDiv = document.getElementById('results');
      
      if (!query) return;

      if (API_KEY === '') {
        resultsDiv.innerHTML = '<p class="error">Vul eerst je eigen TMDB API key in op regel 91 van het bestand!</p>';
        return;
      }

      resultsDiv.innerHTML = '<p>Zoeken...</p>';

      try {
        // 1. Zoek de film
        const searchUrl = `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}&language=nl-BE`;
        const searchRes = await fetch(searchUrl);
        
        if (!searchRes.ok) throw new Error(`API Fout: ${searchRes.status}`);

        const searchData = await searchRes.json();

        if (!searchData.results || searchData.results.length === 0) {
          resultsDiv.innerHTML = '<p>Geen film gevonden met deze titel.</p>';
          return;
        }

        const movie = searchData.results[0];

        // 2. Haal de aanbieders op
        const providersUrl = `https://api.themoviedb.org/3/movie/${movie.id}/watch/providers?api_key=${API_KEY}`;
        const providersRes = await fetch(providersUrl);
        const providersData = await providersRes.json();

        const belgiumData = providersData.results ? providersData.results[REGION] : null;

        // 3. Verwerk de verschillende opties (Abonnement, Huur, Koop)
        let html = `<h2>${movie.title} (${movie.release_date ? movie.release_date.substring(0,4) : 'Onbekend'})</h2>`;

        if (belgiumData) {
          // Combineer abonnement (flatrate), huur (rent) en koop (buy)
          const allOptionTypes = [
            ...(belgiumData.flatrate || []),
            ...(belgiumData.rent || []),
            ...(belgiumData.buy || [])
          ];

          // Verwijder dubbele diensten
          const uniqueProviders = Array.from(
            new Map(allOptionTypes.map(item => [item.provider_id, item])).values()
          );

          // Filter op de gekozen platformen
          const available = uniqueProviders.filter(provider => 
            ALLOWED_PROVIDERS.some(allowed => provider.provider_name.toLowerCase().includes(allowed.toLowerCase()))
          );

          if (available.length > 0) {
            html += '<p>Beschikbaar in België via:</p><ul class="provider-list">';
            available.forEach(p => {
              html += `
                <li class="provider-item">
                  <img src="https://image.tmdb.org/t/p/original${p.logo_path}" alt="${p.provider_name}">
                  <span>${p.provider_name}</span>
                </li>`;
            });
            html += '</ul>';
          } else {
            html += '<p>Niet beschikbaar op de geselecteerde platformen in België.</p>';
          }
        } else {
          html += '<p>Momenteel niet beschikbaar op streamingdiensten in België.</p>';
        }

        resultsDiv.innerHTML = html;

      } catch (error) {
        resultsDiv.innerHTML = `<p class="error">Er is een fout opgetreden: ${error.message}. Controleer je API-sleutel.</p>`;
        console.error(error);
      }
    }
  </script>
</body>
</html>
